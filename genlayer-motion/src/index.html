<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenLayer — Intelligent Contracts</title>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<style>
  :root { --pink: #ff87ff; --purple: #dc00ff; --mint: #a8ffd2; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07030c; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; }
  #overlay, #hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Inter Display', 'Inter', sans-serif; color: #fff; }
  .cue { position: absolute; white-space: nowrap; will-change: transform, opacity, filter; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.02em 0.14em; margin-bottom: -0.1em; }
  .wi { display: inline-block; transform-origin: 50% 80%; }
  .grad { filter: drop-shadow(0 4px 18px rgba(0,0,0,.55)); }
  .grad .wi { background: linear-gradient(100deg, #ffe0ff 0%, var(--pink) 35%, #e64dff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mint .wi { color: var(--mint); text-shadow: 0 0 34px rgba(168,255,210,.45); }

  .h1 { font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -0.035em; text-shadow: 0 6px 40px rgba(0,0,0,.55); }
  .h2 { font-weight: 800; font-size: 76px; line-height: 1.05; letter-spacing: -0.03em; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .h3 { font-weight: 700; font-size: 58px; line-height: 1.12; letter-spacing: -0.02em; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  .body { font-family: 'Inter'; font-weight: 500; font-size: 36px; line-height: 1.35; color: rgba(255,255,255,.82); text-shadow: 0 2px 18px rgba(0,0,0,.8); }
  .kicker { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.32em; color: var(--mint); text-transform: uppercase; }
  .kicker.pink { color: var(--pink); }
  .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 28px; color: var(--mint); letter-spacing: 0.06em; }
  .center { left: 0; right: 0; text-align: center; }
  .num { font-weight: 900; font-size: 250px; line-height: 0.9; letter-spacing: -0.05em; color: transparent; -webkit-text-stroke: 3px var(--pink); }
  .num .wi { color: transparent; }
  .brand { font-weight: 900; font-size: 120px; letter-spacing: 0; }

  .chips { display: flex; gap: 22px; justify-content: center; align-items: center; }
  .chip { font-family: 'Inter'; font-weight: 800; font-size: 30px; letter-spacing: 0.04em; padding: 18px 34px; border-radius: 999px;
          border: 2.5px solid var(--pink); background: rgba(220,0,255,.14); box-shadow: 0 0 40px rgba(220,0,255,.35), inset 0 0 22px rgba(255,135,255,.15); }
  .chip.mint { border-color: var(--mint); background: rgba(168,255,210,.1); color: var(--mint); box-shadow: 0 0 40px rgba(168,255,210,.25); }
  .chip.op { border: none; background: none; box-shadow: none; font-size: 46px; padding: 0 4px; color: rgba(255,255,255,.7); }

  /* HUD */
  #hud { opacity: 0; }
  .corner { position: absolute; width: 46px; height: 46px; border-color: rgba(255,135,255,.75); border-style: solid; border-width: 0; }
  .corner.tl { left: 44px; top: 44px; border-left-width: 3px; border-top-width: 3px; }
  .corner.tr { right: 44px; top: 44px; border-right-width: 3px; border-top-width: 3px; }
  .corner.bl { left: 44px; bottom: 44px; border-left-width: 3px; border-bottom-width: 3px; }
  .corner.br { right: 44px; bottom: 44px; border-right-width: 3px; border-bottom-width: 3px; }
  .hudtxt { position: absolute; font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; letter-spacing: 0.24em; color: rgba(255,255,255,.62); }
  .hudtxt b { color: var(--pink); font-weight: 700; }
  #hud-tl { left: 112px; top: 58px; }
  #hud-tr { right: 112px; top: 58px; text-align: right; }
  #hud-bl { left: 112px; bottom: 56px; }
  #hud-br { right: 112px; bottom: 56px; text-align: right; }
  #progress { position: absolute; left: 420px; right: 420px; bottom: 64px; height: 3px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  #progress i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--mint), var(--pink), var(--purple)); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px var(--mint); margin-right: 12px; vertical-align: 1px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="overlay"></div>
<div id="hud">
  <div class="hudtxt" id="hud-tl"><span class="dot"></span><b>GENLAYER</b> // INTELLIGENT CONTRACTS</div>
  <div class="hudtxt" id="hud-tr">@GENLAYER</div>
  <div class="hudtxt" id="hud-bl">SCENE <b id="hud-scene">01</b> / 08</div>
  <div class="hudtxt" id="hud-br">TC <span id="hud-tc">00:00:00</span></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
